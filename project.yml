name: ApkSandbox
options:
  bundleIdPrefix: com.kungops
  deploymentTarget:
    iOS: "12.0"
targets:
  ApkSandbox:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: ApkSandbox
        PRODUCT_BUNDLE_IDENTIFIER: com.kungops.apksandbox
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        # iPhone only (iPhone 6/7 class devices on iOS 12 and iOS 15).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
