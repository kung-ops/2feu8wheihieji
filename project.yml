name: ApkSandbox
options:
  bundleIdPrefix: com.kungops
  deploymentTarget:
    iOS: "12.0"
targets:
  ApkSandbox:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: ApkSandbox
        PRODUCT_BUNDLE_IDENTIFIER: com.kungops.apksandbox
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
