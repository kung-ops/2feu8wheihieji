name: Linux Dalvik interpreter compile check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  linux-runner:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: Build the actual Dalvik interpreter
        run: bash Tools/LinuxRunner/build.sh
      - name: Verify runner CLI exits nonzero without an APK
        shell: bash
        run: |
          set +e
          Tools/LinuxRunner/build/runner > runner-help.txt 2>&1
          code=$?
          cat runner-help.txt
          test "$code" -eq 2
          grep -q "usage: runner" runner-help.txt

      - name: Test PC Bridge server
        run: node PCBridge/test-server.js
