workflows:
  apk-sandbox-ios:
    name: APK Sandbox iOS build (unsigned IPA)
    # Codemagic removed Xcode 15. Xcode 16.4 is the oldest Xcode left, and it
    # still produces binaries that run on iOS 12 when sideloaded (Apple only
    # blocks iOS 12 for App Store / TestFlight installs, which we don't use).
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.4
    scripts:
      - name: Show Xcode version
        script: |
          xcodebuild -version
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate the Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned IPA
        script: |
          xcodebuild \
            -project ApkSandbox.xcodeproj \
            -scheme ApkSandbox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            clean build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ApkSandbox.app Payload/
          zip -qr ApkSandbox.ipa Payload
    artifacts:
      - ApkSandbox.ipa
