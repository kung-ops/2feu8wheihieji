workflows:
  modern-ios:
    name: Modern iOS build (unsigned)
    # Xcode 15.4 is the ONLY Xcode that builds working iOS 12 apps, and on
    # Codemagic it lives on the M4 machines — not the default M2. If this
    # instance isn't on your plan, the build will say so (see notes below).
    instance_type: mac_mini_m4
    max_build_duration: 30
    environment:
      xcode: 15.4
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate the Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned IPA
        script: |
          xcodebuild \
            -project Modern.xcodeproj \
            -scheme Modern \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Modern.app Payload/
          zip -r Modern.ipa Payload
    artifacts:
      - Modern.ipa
