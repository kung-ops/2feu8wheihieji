workflows:
  apk-sandbox-ios:
    name: APK Sandbox iOS build (unsigned IPA)
    # Codemagic removed Xcode 15. Xcode 16.4 is the oldest Xcode left, and it
    # still produces binaries that run on iOS 12 when sideloaded (Apple only
    # blocks iOS 12 for App Store / TestFlight installs, which we don't use).
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.4
    # Build automatically whenever main changes on GitHub, and for every pull
    # request into main (so a PR shows whether the iOS app still builds).
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Show Xcode version
        script: |
          xcodebuild -version
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Stamp build with commit id
        script: |
          COMMIT=$(git rev-parse --short=7 HEAD)
          echo "let buildCommit = \"$COMMIT\"" > Sources/BuildInfo.swift
          echo "Building commit $COMMIT"
      - name: Generate the Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned IPA
        script: |
          xcodebuild \
            -project ApkSandbox.xcodeproj \
            -scheme ApkSandbox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            clean build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ApkSandbox.app Payload/
          zip -qr ApkSandbox.ipa Payload
          # Same file for TrollStore (iOS 14–15.x, e.g. an iPhone 7 on iOS 15).
          cp ApkSandbox.ipa ApkSandbox.tipa
      - name: Check the app targets iOS 12 on arm64
        script: |
          BIN=Payload/ApkSandbox.app/ApkSandbox
          lipo -info "$BIN"
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION || true
          echo "MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/ApkSandbox.app/Info.plist)"
          ls -la ApkSandbox.ipa ApkSandbox.tipa
    artifacts:
      - ApkSandbox.ipa
      - ApkSandbox.tipa
