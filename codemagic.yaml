workflows:
  modern-ios:
    name: Modern iOS build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      # Xcode 15.4 reliably supports an iOS 12.0 deployment target.
      # If this image is unavailable, change it to another 15.x version
      # that Codemagic lists for your account.
      xcode: 15.4
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate the Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned IPA
        script: |
          xcodebuild \
            -project Modern.xcodeproj \
            -scheme Modern \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Modern.app Payload/
          zip -r Modern.ipa Payload
    artifacts:
      - Modern.ipa
